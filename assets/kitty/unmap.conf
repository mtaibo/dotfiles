# Let VS Code-style shortcuts through to Neovim (see modules/home/editors/nvim.nix):
# a map with no action unmaps it. Ctrl+Shift+P is a prefix for the hints
# kitten, so each of its sequences goes.
map kitty_mod+p>f
map kitty_mod+p>shift+f
map kitty_mod+p>l
map kitty_mod+p>w
map kitty_mod+p>h
map kitty_mod+p>n
map kitty_mod+p>y
map kitty_mod+f
map ctrl+tab
map ctrl+shift+tab

# Base style for C, applied on save by Neovim (conform) and by clangd.
# The layout rules clang-format can't express live in c-style.py.
BasedOnStyle: LLVM
IndentWidth: 2
UseTab: Never
ColumnLimit: 80
# c-style.py sorts includes by length.
SortIncludes: Never
# A blank line between functions; c-style.py widens it to three around main.
SeparateDefinitionBlocks: Always
MaxEmptyLinesToKeep: 1
AllowShortFunctionsOnASingleLine: None

# Base style for C and Java. code-style.py runs clang-format with it on save,
# then applies the layout rules clang-format can't express. clangd reads it
# too.
BasedOnStyle: LLVM
IndentWidth: 2
UseTab: Never
ColumnLimit: 80
# code-style.py sorts includes and imports by length.
SortIncludes: Never
# code-style.py spaces the functions (one-line ones can stay together).
SeparateDefinitionBlocks: Leave
MaxEmptyLinesToKeep: 1
# Short functions, ifs, loops and blocks on one line when they fit.
AllowShortFunctionsOnASingleLine: All
AllowShortIfStatementsOnASingleLine: AllIfsAndElse
AllowShortBlocksOnASingleLine: Always
AllowShortLoopsOnASingleLine: true
# A space between a function's name and its parameters where it's declared
# or defined (int foo (int a)), not in calls (foo(1)).
SpaceBeforeParens: Custom
SpaceBeforeParensOptions:
  AfterControlStatements: true
  AfterForeachMacros: true
  AfterIfMacros: true
  AfterFunctionDeclarationName: true
  AfterFunctionDefinitionName: true
# Wrapped lines go two spaces further in, not under the opening bracket.
AlignAfterOpenBracket: DontAlign
ContinuationIndentWidth: 2
# A trailing comment past column 80 is wrapped onto aligned // lines rather
# than the code being split.
PenaltyBreakComment: 10
# Casts with a space: (int) v.
SpaceAfterCStyleCast: true
# Operators at the end of a wrapped line, in Java too (its preset puts them
# at the start of the next).
BreakBeforeBinaryOperators: None
---
Language: Java
# Annotations on their own line, on fields as well as methods.
BreakAfterJavaFieldAnnotations: true
# Long strings are left alone: clang-format would re-cut them into "a" + "b"
# pieces differently on every pass.
BreakStringLiterals: false
